<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subs Check 配置管理</title>
    <link href="/static/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/monaco/vs/editor/editor.main.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
    <style>
        /* The dashboard fills the viewport below the top bar, so both panels share one
           height without magic offsets; the log list and editor flex into the rest. */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: var(--page-max);
            height: calc(100vh - var(--topbar-h));
            height: calc(100dvh - var(--topbar-h));
            min-height: 640px;
            margin: 0 auto;
            padding: 16px 24px 24px;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
            gap: 16px;
            flex: 1 1 auto;
            min-height: 0;
        }
        .workspace > .panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* Control bar: config file, API key, status and actions */
        .controlbar {
            display: flex;
            flex: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 24px;
            padding: 9px 12px 9px 16px;
        }
        .cb-field { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .cb-config { flex: 1 1 260px; }
        .cb-label {
            display: inline-flex;
            flex: none;
            align-items: center;
            gap: 6px;
            margin: 0;
            color: var(--text-2);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .cb-label .bi { color: var(--text-3); }
        .cb-value { min-width: 0; color: var(--text); font-size: 12.5px; }
        .key-input { position: relative; width: 240px; }
        .key-input .form-control { padding-right: 34px; }
        .key-input .icon-btn { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; font-size: 14px; }
        .cb-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            margin-right: 4px;
            padding: 0 11px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--text-2);
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
        }
        .status-pill.status-idle { background: var(--success-soft); color: var(--success-text); }
        .status-pill.status-running { background: var(--primary-soft); color: var(--primary); }
        .status-pill.status-error { background: var(--danger-soft); color: var(--danger-text); }

        /* Logs */
        .logs-container {
            flex: 1 1 auto;
            min-height: 0;
            margin: 0;
            padding: 12px 16px;
            overflow-y: auto;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-info { color: #a6e3a1; }
        .log-error { color: #f38ba8; }
        .log-warn { color: #f9e2af; }
        .log-debug { color: #89b4fa; }
        .log-time { color: #7f849c; }

        /* Pipeline progress */
        .progress-section {
            display: flex;
            flex: none;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }
        .phase-steps { display: flex; gap: 8px; }
        .phase-step {
            position: relative;
            display: flex;
            flex: 1 1 0;
            align-items: center;
            gap: 10px;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        .phase-icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #eceff5;
            color: var(--text-3);
            font-size: 14px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .phase-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
        .phase-name { overflow: hidden; color: var(--text); font-size: 12.5px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
        .phase-count,
        .phase-link-hint { color: var(--text-2); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .phase-count:empty::before { content: "—"; color: var(--text-3); }
        .phase-step.active { background: var(--primary-soft); border-color: rgba(67, 97, 238, 0.3); }
        .phase-step.active .phase-icon { background: var(--primary); color: #fff; }
        .phase-step.active .phase-name { color: var(--primary); }
        .phase-step.done { background: var(--success-soft); border-color: rgba(46, 196, 182, 0.35); }
        .phase-step.done .phase-icon { background: var(--success); color: #fff; }
        .phase-step.done .phase-name { color: var(--success-text); }

        /* When idle, the last finished stage links to the results page */
        .phase-link-hint,
        .phase-link-chev { display: none; }
        .phase-step.phase-link { padding-right: 26px; cursor: pointer; }
        .phase-step.phase-link .phase-link-chev {
            display: block;
            position: absolute;
            top: 50%;
            right: 10px;
            color: var(--success-text);
            font-size: 12px;
            opacity: 0.6;
            transform: translateY(-50%);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .phase-step.phase-link:hover,
        .phase-step.phase-link:focus-visible {
            border-color: var(--success);
            box-shadow: 0 4px 12px rgba(46, 196, 182, 0.18);
            outline: none;
            transform: translateY(-1px);
        }
        .phase-step.phase-link:hover .phase-link-chev,
        .phase-step.phase-link:focus-visible .phase-link-chev { opacity: 1; transform: translate(2px, -50%); }
        .phase-step.phase-link:hover .phase-count,
        .phase-step.phase-link:focus-visible .phase-count { display: none; }
        .phase-step.phase-link:hover .phase-link-hint,
        .phase-step.phase-link:focus-visible .phase-link-hint { display: block; color: var(--success-text); font-weight: 500; }

        .progress-stats { display: flex; flex-direction: column; gap: 4px; }
        .progress-info {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--text-2);
            font-size: 12.5px;
            font-variant-numeric: tabular-nums;
        }
        .progress {
            position: relative;
            height: 8px;
            border-radius: 999px;
            background-color: #eceff5;
            overflow: hidden;
        }
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s ease;
        }
        .progress-bar-total { z-index: 1; background: rgba(67, 97, 238, 0.22); }
        .progress-bar-success { z-index: 2; background: linear-gradient(90deg, #2ec4b6, #22b07d); }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .success-highlight { color: var(--success-text); font-weight: 700; animation: pulse 1.5s infinite; }

        /* Editor: #editor is absolutely positioned so Monaco measures a definite size on init */
        .editor-wrapper { position: relative; flex: 1 1 auto; min-height: 0; }
        #editor { position: absolute; inset: 0; }
        .editor-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(245, 246, 250, 0.82);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .editor-overlay-message {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-2);
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(22, 27, 45, 0.08);
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .editor-overlay:hover .editor-overlay-message { color: var(--text); transform: translateY(-1px); }

        /* Narrow screens stack the panels; give logs and editor explicit heights */
        @media (max-width: 991.98px) {
            .dashboard { height: auto; min-height: 0; gap: 12px; padding: 12px; }
            .workspace { grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .logs-container { flex: none; height: 50vh; min-height: 320px; }
            .editor-wrapper { flex: none; height: 70vh; min-height: 420px; }
            .cb-actions { margin-left: 0; }
        }

        @media (max-width: 575.98px) {
            .cb-field,
            .cb-actions { width: 100%; }
            .key-input { flex: 1; width: auto; }
            .cb-actions .status-pill { margin-right: auto; }
            .phase-steps { flex-wrap: wrap; }
            .phase-step { flex: 1 1 140px; }
        }
    </style>
</head>
<body>
    {{template "topbar" .}}

    <main class="dashboard">
        <section class="panel controlbar">
            <div class="cb-field cb-config">
                <span class="cb-label"><i class="bi bi-file-earmark-code"></i>配置文件</span>
                <span class="cb-value mono ellipsis" title="{{.configPath}}">{{.configPath}}</span>
            </div>
            <div class="cb-field cb-key">
                <label class="cb-label" for="apiKey"><i class="bi bi-key"></i>API 密钥</label>
                <div class="key-input">
                    <input type="password" class="form-control form-control-sm" id="apiKey" placeholder="请输入API密钥" autocomplete="off">
                    <button class="icon-btn" type="button" id="toggleApiKey" title="显示/隐藏密钥">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
                <button id="saveApiKey" class="btn btn-soft btn-sm" type="button">保存密钥</button>
            </div>
            <div class="cb-actions">
                <span id="statusContainer" class="status-pill">
                    <span id="statusIcon" class="bi bi-hourglass-split"></span>
                    <span id="nextCheckTime">加载中...</span>
                </span>
                <button id="forceClose" class="btn btn-danger-soft btn-sm" type="button">
                    <i class="bi bi-stop-circle"></i>强制停止
                </button>
                <button id="triggerCheck" class="btn btn-primary btn-sm" type="button">
                    <i class="bi bi-play-fill"></i>立即检测
                </button>
            </div>
        </section>

        <div class="workspace">
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="bi bi-terminal"></i>最近日志</h2>
                    <button id="refreshLogs" class="btn btn-ghost btn-sm" type="button">
                        <i class="bi bi-arrow-repeat"></i>刷新
                    </button>
                </div>
                <div id="logs" class="logs-container scroll-dark"></div>
                <div id="progressSection" class="progress-section">
                    <div id="phaseSteps" class="phase-steps" style="display: none;">
                        <div id="phaseStep1" class="phase-step" data-phase="1">
                            <span class="phase-icon"><i class="bi bi-heart-pulse"></i></span>
                            <span class="phase-text">
                                <span class="phase-name">测活</span>
                                <span class="phase-count" id="phaseCount1"></span>
                                <span class="phase-link-hint">查看结果</span>
                            </span>
                            <i class="bi bi-chevron-right phase-link-chev"></i>
                        </div>
                        <div id="phaseStep2" class="phase-step" data-phase="2">
                            <span class="phase-icon"><i class="bi bi-film"></i></span>
                            <span class="phase-text">
                                <span class="phase-name">流媒体+重命名</span>
                                <span class="phase-count" id="phaseCount2"></span>
                                <span class="phase-link-hint">查看结果</span>
                            </span>
                            <i class="bi bi-chevron-right phase-link-chev"></i>
                        </div>
                        <div id="phaseStep3" class="phase-step" data-phase="3">
                            <span class="phase-icon"><i class="bi bi-speedometer"></i></span>
                            <span class="phase-text">
                                <span class="phase-name">测速</span>
                                <span class="phase-count" id="phaseCount3"></span>
                                <span class="phase-link-hint">查看结果</span>
                            </span>
                            <i class="bi bi-chevron-right phase-link-chev"></i>
                        </div>
                    </div>
                    <div class="progress-stats">
                        <div class="progress-info">
                            <div>处理进度: <span id="progressText">N/A</span></div>
                            <div><span id="progressPercent">N/A</span></div>
                        </div>
                        <div class="progress-info">
                            <div id="successLabel">成功节点: <span id="successText">N/A</span></div>
                            <div><span id="processPercent">N/A</span></div>
                        </div>
                    </div>
                    <div class="progress">
                        <div id="progressBarSuccess" class="progress-bar progress-bar-success" role="progressbar" style="width: 0%"></div>
                        <div id="progressBarTotal" class="progress-bar progress-bar-total" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="bi bi-sliders"></i>配置编辑器</h2>
                    <div class="panel-actions">
                        <button id="toggleConfig" class="icon-btn bordered" type="button" title="显示/隐藏配置">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                        <button id="reloadConfig" class="btn btn-ghost btn-sm" type="button">
                            <i class="bi bi-arrow-repeat"></i>重载
                        </button>
                        <button id="saveConfig" class="btn btn-primary btn-sm" type="button">
                            <i class="bi bi-save"></i>保存
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="editor"></div>
                    <div id="editorOverlay" class="editor-overlay">
                        <div class="editor-overlay-message">
                            <i class="bi bi-eye-slash"></i>配置已隐藏，点击查看
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="/static/bootstrap/bootstrap.bundle.min.js"></script>

    <!-- Monaco Editor -->
    <script>var require = { paths: { 'vs': '/static/monaco/vs' } };</script>
    <script src="/static/monaco/vs/loader.js"></script>
    <script src="/static/monaco/vs/editor/editor.main.nls.js"></script>
    <script src="/static/monaco/vs/editor/editor.main.js"></script>

    <script>
        let editor;
        const PHASE_LABELS = {
            1: { name: '测活', countLabel: '存活' },
            2: { name: '流媒体+重命名', countLabel: '完成' },
            3: { name: '测速', countLabel: '通过' }
        };

        // 缓存高频访问的 DOM 元素
        const dom = {
            apiKey: document.getElementById('apiKey'),
            toggleApiKey: document.getElementById('toggleApiKey'),
            saveApiKey: document.getElementById('saveApiKey'),
            logs: document.getElementById('logs'),
            phaseSteps: document.getElementById('phaseSteps'),
            progressText: document.getElementById('progressText'),
            progressPercent: document.getElementById('progressPercent'),
            processPercent: document.getElementById('processPercent'),
            progressBarTotal: document.getElementById('progressBarTotal'),
            progressBarSuccess: document.getElementById('progressBarSuccess'),
            successLabel: document.getElementById('successLabel'),
            successText: document.getElementById('successText'),
            statusContainer: document.getElementById('statusContainer'),
            statusIcon: document.getElementById('statusIcon'),
            statusText: document.getElementById('nextCheckTime'),
            versionInfo: document.getElementById('versionInfo'),
        };

        // 初始化API密钥
        const storedApiKey = localStorage.getItem('apiKey') || '';
        dom.apiKey.value = storedApiKey;

        // 切换API密钥可见性
        dom.toggleApiKey.addEventListener('click', function() {
            const icon = this.querySelector('i');

            if (dom.apiKey.type === 'password') {
                dom.apiKey.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                dom.apiKey.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        });

        // 保存API密钥到本地存储
        dom.saveApiKey.addEventListener('click', function() {
            const apiKey = dom.apiKey.value.trim();
            localStorage.setItem('apiKey', apiKey);

            const button = this;
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = '验证中...';

            fetch('/api/status', {
                headers: { 'X-API-Key': apiKey }
            })
            .then(response => {
                if (response.status === 401) {
                    alert('API密钥无效，请检查后重试');
                    return false;
                } else if (response.ok) {
                    alert('API密钥有效，已保存到本地');
                    loadConfig();
                    loadLogs();
                    updateStatus();
                    getVersionInfo();
                    return true;
                } else {
                    throw new Error('验证失败');
                }
            })
            .catch(error => {
                console.error('验证API密钥失败:', error);
                alert('验证API密钥时出错，但已保存到本地存储');
            })
            .finally(() => {
                button.disabled = false;
                button.textContent = originalText;
            });
        });

        // 获取API密钥
        function getApiKey() {
            return localStorage.getItem('apiKey') || '';
        }

        // 添加API密钥到请求头
        function addApiKeyHeader(headers = {}) {
            const apiKey = getApiKey();
            return { ...headers, 'X-API-Key': apiKey };
        }

        // 初始化编辑器
        require(['vs/editor/editor.main'], function() {
            monaco.languages.register({ id: 'yaml' });
            monaco.languages.setMonarchTokensProvider('yaml', {
                tokenizer: {
                    root: [
                        [/^[\s]*#.*$/, 'comment'],
                        [/^[\s]*[\w\-]+:/, 'keyword'],
                        [/^[\s]*-/, 'keyword'],
                        [/".*?"/, 'string'],
                        [/'.*?'/, 'string'],
                    ]
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                language: 'yaml',
                theme: 'vs',
                automaticLayout: true,
                minimap: { enabled: false },
                fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono').trim(),
                fontSize: 13,
                lineHeight: 20,
                padding: { top: 12, bottom: 12 },
                scrollBeyondLastLine: false,
                renderLineHighlight: 'gutter',
                overviewRulerBorder: false,
                hideCursorInOverviewRuler: true,
                // Match the page's thin scrollbars.
                scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10, useShadows: false },
            });

            loadConfig();

            const toggleConfigBtn = document.getElementById('toggleConfig');
            const editorOverlay = document.getElementById('editorOverlay');

            editorOverlay.style.display = 'flex';

            toggleConfigBtn.addEventListener('click', function() {
                const isHidden = editorOverlay.style.display === 'flex';
                editorOverlay.style.display = isHidden ? 'none' : 'flex';
                const icon = toggleConfigBtn.querySelector('i');
                icon.className = isHidden ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            editorOverlay.addEventListener('click', function() {
                editorOverlay.style.display = 'none';
                const icon = toggleConfigBtn.querySelector('i');
                icon.className = 'bi bi-eye';
            });
        });

        // 处理未授权响应
        function handleUnauthorized(response, showAlert = true) {
            if (response.status === 401) {
                if (showAlert) {
                    alert('API密钥无效或未提供，请检查您的API密钥');
                }
                return true;
            }
            return false;
        }

        // 加载配置
        function loadConfig() {
            return fetch('/api/config', {
                headers: addApiKeyHeader()
            })
            .then(response => {
                if (handleUnauthorized(response, false)) return;
                if (!response.ok) throw new Error('加载配置失败');
                return response.json();
            })
            .then(data => {
                if (editor && data) editor.setValue(data.content);
                return data;
            })
            .catch(error => {
                console.error('加载配置失败:', error);
            });
        }

        // 保存配置
        document.getElementById('saveConfig').addEventListener('click', function() {
            const content = editor.getValue();

            fetch('/api/config', {
                method: 'POST',
                headers: addApiKeyHeader({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ content })
            })
            .then(response => {
                if (handleUnauthorized(response, true)) throw new Error('未授权');
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    alert('保存失败: ' + data.error);
                } else {
                    alert(data.message);
                    updateStatus();
                }
            })
            .catch(error => {
                if (error.message !== '未授权') alert('保存失败: ' + error.message);
            });
        });

        // 重新加载配置
        document.getElementById('reloadConfig').addEventListener('click', function() {
            const button = this;
            const icon = button.querySelector('i');
            icon.classList.add('rotate-animation');
            button.disabled = true;
            loadConfig().finally(() => {
                setTimeout(() => { icon.classList.remove('rotate-animation'); button.disabled = false; }, 500);
            });
        });

        // 强制关闭
        document.getElementById('forceClose').addEventListener('click', function() {
            if (!confirm('确定要强制停止当前阶段吗？已有结果将被保留。')) return;

            const button = this;
            const icon = button.querySelector('i');
            const originalIcon = icon.className;
            icon.className = 'bi bi-arrow-repeat rotate-animation';
            button.disabled = true;

            fetch('/api/force-close', {
                method: 'POST',
                headers: addApiKeyHeader()
            })
            .then(response => {
                if (handleUnauthorized(response, true)) throw new Error('未授权');
                return response.json();
            })
            .catch(error => {
                if (error.message !== '未授权') {
                    console.error('强制停止失败:', error);
                    alert('强制停止失败: ' + error.message);
                }
            })
            .finally(() => {
                setTimeout(() => { icon.className = originalIcon; button.disabled = false; }, 500);
            });
        });

        // 立即检测
        document.getElementById('triggerCheck').addEventListener('click', function() {
            const button = this;
            const icon = button.querySelector('i');
            const originalIcon = icon.className;
            icon.className = 'bi bi-arrow-repeat rotate-animation';
            button.disabled = true;

            fetch('/api/trigger-check', {
                method: 'POST',
                headers: addApiKeyHeader()
            })
            .then(response => {
                if (handleUnauthorized(response, true)) throw new Error('未授权');
                return response.json();
            })
            .then(data => { loadLogs(); })
            .catch(error => {
                if (error.message !== '未授权') console.error('触发检测失败:', error);
            })
            .finally(() => {
                setTimeout(() => { icon.className = originalIcon; button.disabled = false; }, 500);
            });
        });

        // 加载日志
        function loadLogs() {
            return fetch('/api/logs', {
                headers: addApiKeyHeader()
            })
            .then(response => {
                if (handleUnauthorized(response, false)) throw new Error('未授权');
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    dom.logs.textContent = '加载日志失败: ' + data.error;
                } else {
                    const isScrolledToBottom = dom.logs.scrollHeight - dom.logs.clientHeight <= dom.logs.scrollTop + 1;
                    const fragment = document.createDocumentFragment();
                    data.logs.forEach(log => {
                        const logLine = document.createElement('div');
                        logLine.innerHTML = colorizeLog(log);
                        fragment.appendChild(logLine);
                    });
                    dom.logs.innerHTML = '';
                    dom.logs.appendChild(fragment);
                    if (isScrolledToBottom) {
                        dom.logs.scrollTop = dom.logs.scrollHeight;
                    }
                }
                return data;
            })
            .catch(error => {
                if (error.message !== '未授权') {
                    dom.logs.textContent = '加载日志失败: ' + error.message;
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // 为日志添加颜色
        const LOG_LEVEL_CLASS = { INF: 'log-info', ERR: 'log-error', WRN: 'log-warn', DBG: 'log-debug' };
        function colorizeLog(log) {
            log = escapeHtml(log);
            log = log.replace(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/, '<span class="log-time">$1</span>');
            log = log.replace(/\b(INF|ERR|WRN|DBG)\b/, (m) => '<span class="' + LOG_LEVEL_CLASS[m] + '">' + m + '</span>');
            return log;
        }

        // 刷新日志
        document.getElementById('refreshLogs').addEventListener('click', function() {
            const button = this;
            const icon = button.querySelector('i');
            icon.classList.add('rotate-animation');
            button.disabled = true;
            loadLogs().finally(() => {
                setTimeout(() => { icon.classList.remove('rotate-animation'); button.disabled = false; }, 500);
            });
        });

        // 缓存阶段步骤 DOM 元素
        const phaseStepEls = [null, document.getElementById('phaseStep1'), document.getElementById('phaseStep2'), document.getElementById('phaseStep3')];
        const phaseCountEls = [null, document.getElementById('phaseCount1'), document.getElementById('phaseCount2'), document.getElementById('phaseCount3')];

        // 更新阶段步骤指示器
        function updatePhaseSteps(phase, available, total, phaseResults) {
            // 检查是否有任何阶段结果
            const hasResults = phaseResults && (phaseResults['1'] || phaseResults['2'] || phaseResults['3']);

            if (phase === 0 && !hasResults) {
                dom.phaseSteps.style.display = 'none';
                return;
            }

            dom.phaseSteps.style.display = 'flex';

            for (let i = 1; i <= 3; i++) {
                const step = phaseStepEls[i];
                const count = phaseCountEls[i];
                const label = PHASE_LABELS[i] ? PHASE_LABELS[i].countLabel : '';
                const result = phaseResults ? phaseResults[String(i)] : null;

                step.classList.remove('active', 'done');

                if (i < phase) {
                    // 已完成的阶段：用后端保存的结果
                    step.classList.add('done');
                    if (result) {
                        count.textContent = label + ': ' + result.available + '/' + result.total;
                    }
                } else if (i === phase) {
                    // 当前阶段：用实时数据
                    step.classList.add('active');
                    count.textContent = label + ': ' + available + '/' + total;
                } else if (phase === 0 && result) {
                    // 空闲时：显示上次结果
                    step.classList.add('done');
                    count.textContent = label + ': ' + result.available + '/' + result.total;
                } else {
                    count.textContent = '';
                }
            }
        }

        // When idle, the last finished stage card (usually speed test) opens the results page.
        function updateResultsLink(idle) {
            let target = 0;
            if (idle) {
                for (let i = 3; i >= 1; i--) {
                    if (phaseStepEls[i].classList.contains('done')) { target = i; break; }
                }
            }
            for (let i = 1; i <= 3; i++) {
                const step = phaseStepEls[i];
                const on = i === target;
                step.classList.toggle('phase-link', on);
                if (on) {
                    step.setAttribute('role', 'link');
                    step.setAttribute('tabindex', '0');
                    step.setAttribute('title', '查看检测结果');
                } else {
                    step.removeAttribute('role');
                    step.removeAttribute('tabindex');
                    step.removeAttribute('title');
                }
            }
        }

        dom.phaseSteps.addEventListener('click', function(e) {
            if (e.target.closest('.phase-link')) window.location.href = '/admin/results';
        });
        dom.phaseSteps.addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.phase-link')) {
                e.preventDefault();
                window.location.href = '/admin/results';
            }
        });

        // 更新进度条
        function updateProgressBar(total, processed, available, phase, phaseResults) {
            const percentTotal = total > 0 ? (processed / total * 100).toFixed(1) : 0;

            dom.progressText.textContent = processed + '/' + total;
            dom.progressPercent.textContent = percentTotal + '%';
            dom.progressBarTotal.style.width = percentTotal + '%';

            const percentSuccess = total > 0 ? (available / total * 100).toFixed(1) : 0;
            dom.processPercent.textContent = percentSuccess + '%';

            // 显示阶段对应的标签
            const label = (phase && PHASE_LABELS[phase]) ? PHASE_LABELS[phase].countLabel : '成功节点';
            if (dom.successLabel && dom.successText) {
                dom.successLabel.childNodes[0].textContent = label + ': ';
                if (available > 0) {
                    dom.successText.innerHTML = '<span class="success-highlight">' + available + '</span>/' + total;
                } else {
                    dom.successText.textContent = available + '/' + total;
                }
            }

            dom.progressBarSuccess.style.width = percentSuccess + '%';

            // 更新阶段指示器
            updatePhaseSteps(phase, available, total, phaseResults);
        }

        // 重置进度条到初始状态
        function resetProgress() {
            dom.progressText.textContent = 'N/A';
            dom.progressPercent.textContent = 'N/A';
            dom.processPercent.textContent = 'N/A';
            dom.progressBarTotal.style.width = '0%';
            dom.progressBarSuccess.style.width = '0%';
            if (dom.successLabel) {
                dom.successLabel.childNodes[0].textContent = '成功节点: ';
                dom.successText.textContent = 'N/A';
            }
        }

        // 更新状态
        // Pipeline stages run concurrently, so rows stay "active" with live counts.
        // `done` counts items that finished the stage; `pass` counts items that moved on.
        // When speed testing is off, the speed row stays visible but inactive with an
        // empty counter — matching the legacy "grayed, no data" look rather than
        // hiding the row outright (which shifted the layout).
        function updatePipelineSteps(p, hasSpeed) {
            dom.phaseSteps.style.display = 'flex';
            const rows = [
                { idx: 1, label: '存活', pass: p.alivePass,  total: p.total, active: true },
                { idx: 2, label: '通过', pass: p.filterPass, total: p.alivePass, active: true },
                { idx: 3, label: '通过', pass: p.speedPass, total: p.filterPass, active: hasSpeed },
            ];
            for (const r of rows) {
                const step = phaseStepEls[r.idx];
                const count = phaseCountEls[r.idx];
                step.classList.remove('active', 'done');
                if (r.active) {
                    step.classList.add('active');
                    count.textContent = r.label + ': ' + r.pass + '/' + r.total;
                } else {
                    count.textContent = '';
                }
            }
        }

        function updatePipelineBar(p, hasSpeed) {
            const total = p.total;
            const processed = p.aliveDone;                         // how far through input
            const success = hasSpeed ? p.speedPass : p.filterPass; // end-to-end pass count

            const pctProcessed = total > 0 ? (processed / total * 100).toFixed(1) : 0;
            dom.progressText.textContent = processed + '/' + total;
            dom.progressPercent.textContent = pctProcessed + '%';
            dom.progressBarTotal.style.width = pctProcessed + '%';

            const pctSuccess = total > 0 ? (success / total * 100).toFixed(1) : 0;
            dom.processPercent.textContent = pctSuccess + '%';
            dom.progressBarSuccess.style.width = pctSuccess + '%';

            if (dom.successLabel && dom.successText) {
                dom.successLabel.childNodes[0].textContent = '通过: ';
                dom.successText.innerHTML = success > 0
                    ? '<span class="success-highlight">' + success + '</span>/' + total
                    : success + '/' + total;
            }
        }

        // Status pill in the control bar: kind is idle | running | error.
        function setStatus(kind, icon, text) {
            dom.statusContainer.className = 'status-pill status-' + kind;
            dom.statusIcon.className = 'bi ' + icon;
            dom.statusText.textContent = text;
        }

        function updateStatus() {
            fetch('/api/status', {
                headers: addApiKeyHeader()
            })
            .then(response => {
                if (handleUnauthorized(response, false)) return;
                return response.json();
            })
            .then(data => {
                if (data) {
                    if (data.checking) {
                        setStatus('running', 'bi-arrow-repeat rotate-animation', '正在检测中...');

                        if (data.pipeline) {
                            updatePipelineBar(data.pipeline, !!data.hasSpeedTest);
                            updatePipelineSteps(data.pipeline, !!data.hasSpeedTest);
                        } else {
                            // legacy fallback (older server)
                            updateProgressBar(data.proxyCount, data.progress, data.available, data.phase, data.phaseResults);
                        }
                        updateResultsLink(false);
                    } else {
                        setStatus('idle', 'bi-check-circle-fill', '空闲');

                        updatePhaseSteps(0, 0, 0, data.phaseResults);
                        resetProgress();
                        updateResultsLink(true);
                    }
                }
            })
            .catch(error => {
                console.error('获取状态失败:', error);
                setStatus('error', 'bi-exclamation-triangle-fill', '获取状态失败');
                resetProgress();
            });
        }

        // 初始加载
        updateStatus();
        loadLogs();

        // 检查API密钥
        const apiKey = localStorage.getItem('apiKey');
        if (!apiKey) {
            alert('请先输入API密钥以使用本系统');
            dom.apiKey.focus();
        }

        // 定时刷新
        setInterval(loadLogs, 10000);
        setInterval(updateStatus, 3000);

        // 获取版本信息
        function getVersionInfo() {
            fetch('/api/version', {
                headers: addApiKeyHeader()
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.version) {
                    dom.versionInfo.textContent = data.version;
                }
            })
            .catch(error => {
                console.error('获取版本信息失败:', error);
                dom.versionInfo.textContent = '版本未知';
            });
        }

        getVersionInfo();
    </script>

</body>
</html>
